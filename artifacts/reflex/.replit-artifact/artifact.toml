kind = "web"
previewPath = "/"
title = "Reflex Delivery Coordination"
description = "A delivery coordination platform for Kenyan retailers that helps staff create requests, dispatchers assign riders, and riders complete deliveries with visible status and proof of delivery."
version = "1.0.0"
id = "artifacts/reflex"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25655

[services.development]
run = "pnpm --filter @workspace/reflex run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/reflex", "run", "build" ]
serve = "static"
publicDir = "artifacts/reflex/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25655"
BASE_PATH = "/"
